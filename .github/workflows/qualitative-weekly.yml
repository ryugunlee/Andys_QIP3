name: Qualitative Weekly

# 정성 평가의 LLM을 쓰지 않는 부분만 매주 돌린다 (qualitative_weekly.py 참고):
# 관측값이 있는 종목 재판정(★ 플래그 갱신) → DB 저장 → QIP4 선별 한국 종목의 사업보고서 미리 받기
# → 사이트 재빌드. 채점(토큰 사용)은 사람이 grade_qualitative.py extract로 종목을 골라 실행한다.
# 그래서 이 워크플로에는 ANTHROPIC/DEEPSEEK 키를 넣지 않는다 — 넣을 경로 자체를 없애 둔다.

on:
  schedule:
    # 매주 일요일 21:00 UTC == 월요일 06:00 KST (주중 수집 워크플로보다 앞서 등급카드를 갱신)
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      ticker:
        description: "이 종목만 재판정 (비우면 관측값이 있는 전 종목)"
        required: false
        default: ""

concurrency:
  group: qualitative-weekly
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  DART_API_KEY: ${{ secrets.DART_API_KEY }}
  # 관리자 화면(docs/admin/)이 읽을 Supabase 접속 정보 — presentation/builders/site_config.py
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB from data-store release
        run: bash .github/scripts/restore_db.sh

      # 미리 받아 둔 사업보고서 원문은 git에 넣지 않으므로(수 MB) DB처럼 릴리스 자산으로 이어 받는다.
      - name: Restore cached filings
        run: |
          bash .github/scripts/restore_db.sh 'qualitative_sources.tar.gz'
          if [ -f qipinfos/qualitative_sources.tar.gz ]; then
            tar xzf qipinfos/qualitative_sources.tar.gz
            echo "[weekly] 캐시된 원문 $(ls qualitative/sources | wc -l)개 복원"
          fi

      # 입력값은 env로 받아 셸에 넘긴다. `${{ }}`를 run에 직접 박으면 GitHub가 실행 전에 문자열을
      # 치환하므로 티커 입력에 셸 명령을 심어 시크릿을 빼낼 수 있다(Actions script injection).
      - name: Regrade and prefetch
        env:
          INPUT_TICKER: ${{ github.event.inputs.ticker }}
        run: python qualitative_weekly.py --ticker "$INPUT_TICKER"

      - name: Pack cached filings
        run: |
          if [ -d qualitative/sources ] && [ -n "$(ls -A qualitative/sources)" ]; then
            tar czf qipinfos/qualitative_sources.tar.gz qualitative/sources
          fi

      - name: Save DuckDB and cached filings to data-store release
        run: |
          bash .github/scripts/save_db.sh \
            qipinfos/andys_qip_kr.duckdb qipinfos/andys_qip_us.duckdb qipinfos/andys_qip_macro.duckdb \
            qipinfos/qualitative_sources.tar.gz

      - name: Rebuild site and commit
        run: bash .github/scripts/build_and_commit_site.sh
