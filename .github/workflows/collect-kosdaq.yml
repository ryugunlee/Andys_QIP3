name: Collect KOSDAQ

# KOSDAQ은 1,820종목이라 네이버 수집 속도(종목당 약 16초)로 8시간이 넘고, GitHub 호스팅
# 러너의 작업 시간 상한 6시간을 넘겨 **한 번도 완주한 적이 없었다**(매 실행이 5시간
# 타임아웃에 잘려 cancelled). 그래서 티커를 4조각으로 나눠 순차 job으로 수집하고
# (조각당 455종목 ≈ 2시간), 마지막 finalize job이 조각을 합쳐 하나의 run으로 확정한다.
# 자세한 배경은 `.claude/PROBLEMS.md` #42 참고.
#
# - 조각 job은 `collection_runs`에 행을 만들지 않는다. 중간 조각이 실패해도 점수 없는
#   반쪽 run이 DB에 남지 않고, 사이트는 지난주의 정상 run을 계속 쓴다.
# - `max-parallel: 1`이 핵심이다. 조각 job이 모두 같은 KR DuckDB를 릴리스 자산으로
#   주고받기 때문에 동시에 돌면 서로를 덮어쓴다 (`.github/scripts/save_db.sh` 참고).

on:
  schedule:
    # 매주 화요일 22:00 UTC == 수요일 07:00 KST (KRX 종가 이후 여유를 둔 시각)
    - cron: "0 22 * * 2"
  workflow_dispatch: {}

concurrency:
  group: collect-kosdaq
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  # 관리자 화면(docs/admin/)이 읽을 Supabase 접속 정보 — presentation/builders/site_config.py
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  CHUNK_TOTAL: "4"

jobs:
  collect:
    name: Collect KOSDAQ chunk ${{ matrix.chunk }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      # 조각 job이 같은 KR DuckDB를 릴리스 자산으로 주고받으므로 **절대 병렬로 돌리면 안 된다.**
      max-parallel: 1
      # 한 조각이 실패해도 남은 조각은 수집한다 — finalize가 그만큼이라도 run으로 확정한다.
      fail-fast: false
      matrix:
        chunk: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB from data-store release
        run: bash .github/scripts/restore_db.sh

      - name: Collect KOSDAQ chunk ${{ matrix.chunk }}
        run: python collect_chunk.py KOSDAQ --chunk ${{ matrix.chunk }}/${{ env.CHUNK_TOTAL }}

      # 일봉·재무제표·원본은 티커 키 upsert라 조각마다 DB에 누적된다.
      - name: Save DuckDB to data-store release
        run: bash .github/scripts/save_db.sh qipinfos/andys_qip_kr.duckdb

      # curated 표는 DB가 아니라 artifact로 넘긴다 — finalize가 합쳐 한 run으로 만든다.
      - name: Upload chunk result
        uses: actions/upload-artifact@v4
        with:
          name: kosdaq-chunk-${{ matrix.chunk }}
          path: qipinfos/chunks/
          retention-days: 3
          if-no-files-found: error

  finalize:
    name: Finalize KOSDAQ run
    needs: collect
    # 조각 하나가 실패해도 남은 조각으로 run을 만든다 (fail-fast: false와 짝).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB from data-store release
        run: bash .github/scripts/restore_db.sh

      - name: Download chunk results
        uses: actions/download-artifact@v4
        with:
          pattern: kosdaq-chunk-*
          merge-multiple: true
          path: qipinfos/chunks/

      # 조각이 하나도 없으면 여기서 0이 아닌 코드로 끝난다 — "성공한 빈 run"을 만들지 않는다.
      - name: Record run and score
        run: python finalize_run.py KOSDAQ

      - name: Save DuckDB to data-store release
        run: bash .github/scripts/save_db.sh qipinfos/andys_qip_kr.duckdb

      - name: Rebuild site and commit
        run: bash .github/scripts/build_and_commit_site.sh
