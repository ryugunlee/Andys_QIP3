name: Qualitative Run

# 종목 하나를 골라 정성 평가를 끝까지 돌린다 (extract → grade → 저장 → 사이트 재빌드).
# 보통은 웹 관리자 화면(docs/admin/)이 Supabase Edge Function을 거쳐 이 워크플로를 깨운다.
# Actions 화면에서 손으로 실행해도 똑같이 동작한다.
#
# ⚠️ AI API 키가 들어가는 유일한 워크플로다. 정기 실행(qualitative-weekly.yml)은 지금도
# 키가 없는 무과금 경로로 남아 있다 — 과금이 가능한 경로를 이 파일 하나로 한정하기 위해서다
# (.claude/DECISIONS.md 2026-09-16 "정성 평가 웹 실행" 참고).
#
# 누가 실행할 수 있는지는 GitHub이 아니라 Supabase가 정한다: 관리자이거나 qip_permissions에
# 등록된 사람만, 자기 티어까지, 하루 상한 안에서. 판정은 DB의 INSERT 정책이 한다
# (supabase/schema_qip3.sql). 저장소 쓰기 권한이 있는 사람은 이 화면에서 직접 실행할 수도 있다.

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "종목 코드 (한국 6자리. 미국은 러너 IP가 EDGAR에 막혀 실패한다)"
        required: true
      tier:
        description: "채점 티어"
        required: true
        default: "quick"
        type: choice
        options: ["quick", "deep"]
      provider:
        description: "quick의 모델 공급자 (compat = DeepSeek 등 저가 엔드포인트)"
        required: true
        default: "compat"
        type: choice
        options: ["compat", "anthropic"]

run-name: "정성 평가 ${{ inputs.ticker }} (${{ inputs.tier }}·${{ inputs.provider }})"

# 동시에 하나만. 두 요청이 겹치면 뒤엣것이 기다렸다가 돈다 — 취소하지 않는 이유는
# 이미 토큰을 쓴 실행을 중간에 버리면 비용만 나가고 결과가 남지 않기 때문이다.
concurrency:
  group: qualitative-run
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  DART_API_KEY: ${{ secrets.DART_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  # 관리자 화면(docs/admin/)이 읽을 Supabase 접속 정보 — presentation/builders/site_config.py
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  run:
    runs-on: ubuntu-latest
    # 원문 수집 + LLM 1회 호출 + 사이트 재빌드. deep(Opus·41만 자)도 이 안에 들어온다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB from data-store release
        run: bash .github/scripts/restore_db.sh

      # 주간 워크플로가 미리 받아 둔 사업보고서 원문. 있으면 DART를 다시 부르지 않는다.
      - name: Restore cached filings
        run: |
          bash .github/scripts/restore_db.sh 'qualitative_sources.tar.gz'
          if [ -f qipinfos/qualitative_sources.tar.gz ]; then
            tar xzf qipinfos/qualitative_sources.tar.gz
            echo "[run] 캐시된 원문 $(ls qualitative/sources | wc -l)개 복원"
          fi

      # 입력값은 반드시 env를 거쳐 셸에 넘긴다. `${{ }}`를 run에 직접 박으면 GitHub가 실행 전에
      # 문자열을 치환하므로 입력에 셸 명령을 심어 시크릿을 빼낼 수 있다(Actions script injection).
      # 커밋 f37d7c2에서 주간 워크플로에 적용한 것과 같은 규칙이다.
      - name: Extract and grade
        env:
          INPUT_TICKER: ${{ inputs.ticker }}
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_PROVIDER: ${{ inputs.provider }}
        run: |
          set -euo pipefail
          case "$INPUT_TICKER" in
            *[!0-9A-Za-z.]* | "") echo "::error::종목 코드 형식이 올바르지 않다: $INPUT_TICKER"; exit 1 ;;
          esac
          python grade_qualitative.py extract "$INPUT_TICKER" --tier "$INPUT_TIER" --provider "$INPUT_PROVIDER"
          python grade_qualitative.py grade "$INPUT_TICKER"

      # 관측값 JSON은 git 추적 대상이다 — 상세 페이지의 등급카드가 근거 서술을 여기서 읽는다
      # (.claude/DECISIONS.md 2026-09-16). 사이트 재빌드보다 먼저 올려야 빌드가 이 값을 본다.
      - name: Commit observations
        env:
          INPUT_TICKER: ${{ inputs.ticker }}
          INPUT_TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain qualitative/observations)" ]; then
            echo "[run] 관측값 변경 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qualitative/observations
          git commit -m "chore: 정성 평가 관측값 갱신 ($INPUT_TICKER · $INPUT_TIER)"
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push

      - name: Pack cached filings
        run: |
          if [ -d qualitative/sources ] && [ -n "$(ls -A qualitative/sources)" ]; then
            tar czf qipinfos/qualitative_sources.tar.gz qualitative/sources
          fi

      - name: Save DuckDB and cached filings to data-store release
        run: |
          bash .github/scripts/save_db.sh \
            qipinfos/andys_qip_kr.duckdb qipinfos/andys_qip_us.duckdb \
            qipinfos/qualitative_sources.tar.gz

      - name: Rebuild site and commit
        run: bash .github/scripts/build_and_commit_site.sh
